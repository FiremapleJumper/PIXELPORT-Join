<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PixelPort NES player</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#090b12;color:#d8dceb;font:11px system-ui}body{display:flex;flex-direction:column}#display{flex:1;min-height:0;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}#display canvas{image-rendering:pixelated;max-width:100%;max-height:100%;object-fit:contain}#start{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:#141a2a;z-index:2}button{font:inherit;cursor:pointer;color:#d7ddf1;background:#2c3653;border:1px solid #455171;border-radius:5px;padding:7px 10px}button:hover{background:#3c4a72}#start button{padding:12px 22px;background:#344bec;color:white;font-size:13px}#start p{max-width:80%;text-align:center;line-height:1.7;color:#a2aac0}#toolbar{display:flex;align-items:center;gap:6px;padding:7px 9px;flex-wrap:wrap;background:#171d2e;flex-shrink:0}#notice{color:#949fbf;margin-left:auto;font-size:9px}#touch{display:none;gap:12px;align-items:center;justify-content:space-between;padding:8px 12px;background:#101624;touch-action:none}#touch button{user-select:none;touch-action:none;min-height:35px;min-width:36px;font-size:13px}.pad{display:grid;grid-template-columns:repeat(3,36px);gap:4px}.pad button:first-child{grid-column:2}.pad button:nth-child(2){grid-column:1}.buttons{display:flex;gap:7px}#touch small{color:#8b96b1}.smooth canvas{image-rendering:auto!important}[hidden]{display:none!important}@media(pointer:coarse),(max-width:600px){#touch{display:flex}#toolbar button{font-size:9px;padding:6px}#notice{width:100%;margin:0}#display canvas{max-width:100%}}</style><script src="vendor/jsnes-2.1.0.min.js" defer></script><script src="nes-runner.js" type="module"></script></head><body><div id="display"><div id="start"><button id="startButton">Start game</button><p id="startText">Arrow keys to move · X / Z for A / B</p><button id="fallback" hidden>Try compatibility core</button></div></div><div id="touch" aria-label="Touch controller"><div class="pad"><button data-nes="4" aria-label="Up">↑</button><button data-nes="6" aria-label="Left">←</button><button data-nes="5" aria-label="Down">↓</button><button data-nes="7" aria-label="Right">→</button></div><div class="buttons"><button data-nes="2">Select</button><button data-nes="3">Start</button></div><div class="buttons"><button data-nes="1">B</button><button data-nes="0">A</button></div></div><div id="toolbar"><button id="pause">Pause</button><button id="reset">Reset</button><button id="save">Save state</button><button id="load">Load state</button><button id="export">Export state</button><button id="import">Import state</button><button id="mute">Mute</button><span id="notice" role="status">JSNES · Click the game for keyboard input</span></div><input type="file" id="stateFile" accept=".json" hidden></body></html>
