name: Publish PixelPort
on:
  push:
    branches: [main]
    paths:
      - pixelport-github-import.zip
      - play/**
      - index.html
      - .github/workflows/deploy-pixelport.yml
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pixelport-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Import the complete arcade
        shell: python
        run: |
          import hashlib, pathlib, zipfile
          root = pathlib.Path(".")
          package = root / "pixelport-github-import.zip"
          if package.exists():
              expected = "5397fbf1d27fd6565e0f66bc0526ebf431b50ebadde4fea9c36a479f05eaa48b"
              if hashlib.sha256(package.read_bytes()).hexdigest() != expected:
                  raise RuntimeError("Site package checksum mismatch")
              with zipfile.ZipFile(package) as archive:
                  for entry in archive.infolist():
                      path = pathlib.PurePosixPath(entry.filename)
                      if path.is_absolute() or ".." in path.parts or not (entry.filename.startswith("play/") or entry.filename == ".nojekyll"):
                          raise RuntimeError("Unexpected archive path")
                  archive.extractall(root)
              package.unlink()
          if not (root / "play/index.html").is_file():
              raise RuntimeError("Upload pixelport-github-import.zip before publishing")
          page = root / "index.html"
          text = page.read_text()
          link = '<p><a href="play/">Open the full PixelPort arcade &#8594;</a></p>'
          if link not in text:
              page.write_text(text.replace("</main>", link + "</main>", 1))
      - name: Save editable site files in the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add play .nojekyll index.html
          if git ls-files --error-unmatch pixelport-github-import.zip >/dev/null 2>&1; then
            git add -u pixelport-github-import.zip
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Publish the full PixelPort arcade under /play/"
            git push
          fi
      - name: Prepare site
        shell: python
        run: |
          import pathlib, shutil
          out = pathlib.Path("_site")
          out.mkdir(exist_ok=True)
          shutil.copy2("index.html", out / "index.html")
          shutil.copytree("play", out / "play")
          (out / ".nojekyll").touch()
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
